<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Quran Study Journal · Para 17–30</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236B7A4F'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='serif'%3E%D8%AC%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar no-print">
    <button class="icon-btn" id="menuBtn" aria-label="Surah list kholein" aria-controls="sidebar" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="topbar-title" id="topbarTitle">Quran Study Journal</span>
    <button class="icon-btn" id="printBtnTop" aria-label="Print / Save as PDF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7" rx="1"/><path d="M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/></svg>
    </button>
  </header>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar no-print" id="sidebar" aria-label="Surah list">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">ج</span>
          <div>
            <div class="brand-title">Quran Journal</div>
            <div class="brand-sub">Para 17–30 · Study Notes</div>
          </div>
        </div>

        <div class="progress" aria-live="polite">
          <div class="progress-row">
            <span>Progress</span>
            <span id="progressText">0 / 94</span>
          </div>
          <div class="progress-bar"><span id="progressFill"></span></div>
        </div>

        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="searchInput" placeholder="Naam, number ya maani…" autocomplete="off" aria-label="Surah dhoondein" />
        </label>

        <label class="para-jump">
          <span class="visually-hidden">Para chunein</span>
          <select id="paraJump" aria-label="Para (Juz) par jayein"></select>
        </label>

        <div class="filters" id="filters" role="group" aria-label="Surah filter">
          <button type="button" class="chip" data-filter="all" aria-pressed="true">Sab</button>
          <button type="button" class="chip" data-filter="ready" aria-pressed="false">Notes</button>
          <button type="button" class="chip" data-filter="done" aria-pressed="false">Complete</button>
          <button type="button" class="chip" data-filter="bookmarks" aria-pressed="false">Bookmarks</button>
        </div>
        <div class="legend" aria-hidden="true">
          <span><span class="dot-ready"></span>Verified</span>
          <span><span class="dot-partial"></span>Partial</span>
          <span><span class="dot-draft"></span>Draft</span>
        </div>
      </div>

      <nav class="surah-nav">
        <ul id="surahList" class="surah-list"></ul>
        <p class="empty-search" id="emptySearch" hidden>Koi surah nahi mili.</p>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-label">Notes Backup (JSON)</div>
        <div class="foot-actions">
          <button class="btn btn-sm" id="exportBtn" type="button" title="Apni notes ki JSON file save karein">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Export
          </button>
          <button class="btn btn-sm" id="importBtn" type="button" title="Backup file se notes wapas laayein">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
            Import
          </button>
          <input type="file" id="importFile" accept="application/json,.json" hidden />
        </div>
      </div>
    </aside>

    <div class="scrim no-print" id="scrim" hidden></div>

    <!-- Main content -->
    <main class="main" id="main" tabindex="-1">
      <div class="page" id="page"></div>
    </main>
  </div>

  <div class="toast no-print" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="quran-arabic.js"></script>
  <script src="quran-arabic-21-77.js"></script>
  <script src="surahs-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
